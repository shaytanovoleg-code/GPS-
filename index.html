<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Крос</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    header h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .user-box { display: flex; flex-direction: column; gap: 6px; }
    .user-box label { font-size: 14px; color: #94a3b8; }

    .user-box input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .user-box input:focus { border-color: #38bdf8; }
    .user-box input:disabled,
    .user-box input[readonly] { opacity: 0.7; cursor: default; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }

    .timer {
      font-size: 56px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      letter-spacing: 2px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      color: #94a3b8;
    }
    .stats span { color: #38bdf8; font-weight: 700; }

    .gps-status {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.1);
      line-height: 1.4;
      min-height: 34px;
    }
    .gps-status.ok    { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .gps-status.error { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .gps-status.warn  { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 10;
    }

    .btn {
      position: relative;
      z-index: 10;
      padding: 20px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start { background: #22c55e; }
    .btn-stop  { background: #ef4444; }

    .result {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #cbd5e1;
      -webkit-user-select: text;
      user-select: text;
    }
    .hidden { display: none; }

    footer { text-align: center; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🏃 GPS Крос</h1>
      <div class="user-box">
        <label for="surname">Прізвище та ім'я:</label>
        <input id="surname" type="text" placeholder="Введіть прізвище та ім'я"
               autocomplete="off" autocorrect="off" autocapitalize="words" />
      </div>
    </header>

    <main>
      <div class="timer" id="timer">00:00:00</div>

      <div class="stats">
        <div><span id="dist">0.00</span> км</div>
        <div><span id="speed">0.0</span> км/год</div>
      </div>

      <div class="gps-status" id="gpsStatus">📍 GPS: очікування</div>

      <div class="buttons">
        <button id="startBtn" class="btn btn-start" type="button">▶ Почати</button>
        <button id="stopBtn" class="btn btn-stop" type="button" disabled>■ Закінчити</button>
      </div>

      <div id="result" class="result hidden"></div>
    </main>

    <footer>
      <small id="footerText">Результат надсилається тренеру</small>
    </footer>
  </div>

  <script>
    // ============================================================
    //  GPS Крос — постійний трекінг
    // ============================================================

    const DEBUG = true; // ← для діагностики, потім false

    const timerEl      = document.getElementById("timer");
    const distEl       = document.getElementById("dist");
    const speedEl      = document.getElementById("speed");
    const gpsStatusEl  = document.getElementById("gpsStatus");
    const startBtn     = document.getElementById("startBtn");
    const stopBtn      = document.getElementById("stopBtn");
    const resultEl     = document.getElementById("result");
    const surnameInput = document.getElementById("surname");
    const footerText   = document.getElementById("footerText");

    let startTime      = null;
    let watchId        = null;
    let totalDistance  = 0;       // метри
    let lastPosition   = null;    // { lat, lon, time, accuracy }
    let allPoints      = [];      // усі прийняті точки
    let intervalId     = null;
    let running        = false;

    // ------------------------------------------------------------
    //  TELEGRAM WEBAPP
    // ------------------------------------------------------------
    const tg = window.Telegram?.WebApp;
    const isTelegram = !!(tg && tg.initDataUnsafe);

    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation();
      } catch (e) {
        console.warn("Telegram WebApp init:", e);
      }
    }

    if (isTelegram && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      const autoName = [u.last_name, u.first_name].filter(Boolean).join(" ").trim();
      if (autoName) {
        surnameInput.value = autoName;
        surnameInput.setAttribute("readonly", "readonly");
        surnameInput.title = "Ім'я автоматично береться з Telegram";
      }
      footerText.textContent = "Результат автоматично надсилається тренеру";
    } else {
      surnameInput.value = localStorage.getItem("kros_surname") || "";
    }

    surnameInput.addEventListener("change", () => {
      if (!surnameInput.hasAttribute("readonly")) {
        localStorage.setItem("kros_surname", surnameInput.value.trim());
      }
    });

    // ------------------------------------------------------------
    //  УТИЛІТИ
    // ------------------------------------------------------------
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function setGpsStatus(text, type = "") {
      gpsStatusEl.textContent = text;
      gpsStatusEl.className = "gps-status" + (type ? " " + type : "");
    }

    function geoErrorMessage(err) {
      const map = {
        1: "доступ заборонено — увімкніть геолокацію",
        2: "місцезнаходження недоступне",
        3: "таймаут — спробуйте ще раз"
      };
      return map[err.code] || "невідома помилка";
    }

    // ------------------------------------------------------------
    //  ДОДАТИ ТОЧКУ ДО ТРЕКУ
    // ------------------------------------------------------------
    // Ключова логіка:
    //  - Кожна нова GPS-точка перевіряється
    //  - Якщо вона "правдоподібна" (рух ≤ 30 км/год) — додаємо відстань
    //  - Якщо "стрибок" — ІГНОРУЄМО, але оновлюємо lastPosition на нову (щоб не тягнути застарілу)
    function addPoint(latitude, longitude, accuracy) {
      const now = Date.now();

      if (!lastPosition) {
        lastPosition = { lat: latitude, lon: longitude, time: now, accuracy };
        allPoints.push({ lat: latitude, lon: longitude, time: now });
        return 0;
      }

      const d = haversine(lastPosition.lat, lastPosition.lon, latitude, longitude);
      const dt = (now - lastPosition.time) / 1000;       // секунди
      const speed = dt > 0 ? (d / dt) * 3.6 : 0;         // км/год

      // Фільтр "стрибків": якщо швидкість > 30 км/год — це GPS-шум або зміна вишки
      // НЕ додаємо відстань, але оновлюємо lastPosition, щоб наступна точка
      // рахувалась від нового місця
      if (d > 0 && speed <= 30) {
        totalDistance += d;
        allPoints.push({ lat: latitude, lon: longitude, time: now });
        lastPosition = { lat: latitude, lon: longitude, time: now, accuracy };
        return d;
      }

      // Стрибок — оновлюємо lastPosition, дистанцію НЕ додаємо
      lastPosition = { lat: latitude, lon: longitude, time: now, accuracy };
      return 0;
    }

    // ------------------------------------------------------------
    //  GPS
    // ------------------------------------------------------------
    function requestPermission() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          setGpsStatus("📍 GPS: не підтримується", "error");
          resolve(false);
          return;
        }
        setGpsStatus("📍 GPS: запит дозволу…", "warn");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setGpsStatus(`📍 GPS: дозвіл надано (±${Math.round(pos.coords.accuracy)} м)`, "ok");
            resolve(true);
          },
          (err) => {
            setGpsStatus(`📍 GPS: ${geoErrorMessage(err)}`, "error");
            resolve(false);
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }

    function startGeolocation() {
      setGpsStatus("📍 GPS: відслідковування…", "warn");

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;

          // Рахуємо дистанцію ЗАВЖДИ (навіть при поганій точності),
          // але показуємо точність користувачу
          const added = addPoint(latitude, longitude, accuracy);

          if (accuracy > 100) {
            setGpsStatus(
              `📍 GPS: слабкий сигнал (±${Math.round(accuracy)} м) · ${(totalDistance/1000).toFixed(2)} км`,
              "warn"
            );
          } else if (accuracy > 50) {
            setGpsStatus(
              `📍 GPS: середній сигнал (±${Math.round(accuracy)} м) · ${(totalDistance/1000).toFixed(2)} км`,
              "warn"
            );
          } else {
            setGpsStatus(
              `📍 GPS: OK (±${Math.round(accuracy)} м) · ${(totalDistance/1000).toFixed(2)} км`,
              "ok"
            );
          }

          if (DEBUG && added > 0) {
            console.log(`[GPS] +${added.toFixed(1)} м, всього ${(totalDistance/1000).toFixed(3)} км`);
          }

          updateUI();
        },
        (err) => {
          console.warn("[GPS] watchPosition error:", err);
          setGpsStatus(`📍 GPS: ${geoErrorMessage(err)}`, "error");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,      // ← завжди свіжі дані
          timeout: 20000,
        }
      );
    }

    function stopGeolocation() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      lastPosition = null;
    }

    function updateUI() {
      if (running && startTime) {
        timerEl.textContent = formatTime(Date.now() - startTime);
      }
      const km = totalDistance / 1000;
      distEl.textContent = km.toFixed(2);
      if (running && startTime) {
        const hours = (Date.now() - startTime) / 3600000;
        const avgSpeed = hours > 0 ? km / hours : 0;
        speedEl.textContent = avgSpeed.toFixed(1);
      }
    }

    // ------------------------------------------------------------
    //  СТАРТ
    // ------------------------------------------------------------
    startBtn.addEventListener("click", async () => {
      const surname = surnameInput.value.trim();
      if (!surname) {
        alert("Введіть прізвище та ім'я перед початком");
        surnameInput.focus();
        return;
      }
      if (!surnameInput.hasAttribute("readonly")) {
        localStorage.setItem("kros_surname", surname);
      }

      startBtn.disabled = true;
      startBtn.textContent = "⏳ Отримуємо GPS…";

      const ok = await requestPermission();
      if (!ok) {
        startBtn.disabled = false;
        startBtn.textContent = "▶ Почати";
        alert(
          "Не вдалося отримати доступ до геолокації.\n\n" +
          "Налаштування → Конфіденційність → Служби геолокації → Safari/Telegram → Дозволити"
        );
        return;
      }

      startTime     = Date.now();
      totalDistance = 0;
      lastPosition  = null;
      allPoints     = [];
      running       = true;

      startBtn.textContent = "▶ Почати";
      stopBtn.disabled = false;
      surnameInput.disabled = true;
      resultEl.classList.add("hidden");
      timerEl.textContent = "00:00:00";
      speedEl.textContent = "0.0";
      distEl.textContent  = "0.00";

      startGeolocation();
      intervalId = setInterval(updateUI, 1000);
      updateUI();
    });

    // ------------------------------------------------------------
    //  ЗАКІНЧИТИ
    // ------------------------------------------------------------
    stopBtn.addEventListener("click", () => {
      if (!running) return;
      running = false;
      clearInterval(intervalId);
      stopGeolocation();

      const endTime    = Date.now();
      const durationMs = endTime - startTime;
      const km         = totalDistance / 1000;
      const avgSpeed   = durationMs > 0 ? km / (durationMs / 3600000) : 0;

      const surname   = surnameInput.value.trim();
      const startDate = new Date(startTime);
      const endDate   = new Date(endTime);

      const dd = String(startDate.getDate()).padStart(2, "0");
      const mm = String(startDate.getMonth() + 1).padStart(2, "0");
      const dateStr = `${dd}.${mm}`;
      const startHHmm = `${String(startDate.getHours()).padStart(2, "0")}:${String(startDate.getMinutes()).padStart(2, "0")}`;
      const endHHmm   = `${String(endDate.getHours()).padStart(2, "0")}:${String(endDate.getMinutes()).padStart(2, "0")}`;
      const durationFormatted = formatTime(durationMs);

      resultEl.textContent =
        `🏁 Тренування завершено\n` +
        `👤 ${surname}\n` +
        `📅 Дата: ${dateStr}\n` +
        `🕐 Початок: ${startHHmm}\n` +
        `🕐 Закінчення: ${endHHmm}\n` +
        `⏱ Час тренування: ${durationFormatted}\n` +
        `📏 Дистанція: ${km.toFixed(2)} км\n` +
        `⚡ Середня швидкість: ${avgSpeed.toFixed(2)} км/год\n` +
        `📍 GPS-точок: ${allPoints.length}\n\n` +
        `✅ Дані надіслано тренеру.`;
      resultEl.classList.remove("hidden");

      const payload = {
        action: "kros_result",
        surname,
        date: dateStr,
        startTime: startHHmm,
        endTime: endHHmm,
        durationFormatted,
        durationSec: Math.floor(durationMs / 1000),
        distanceKm: +km.toFixed(3),
        avgSpeedKmh: +avgSpeed.toFixed(2),
        startISO: startDate.toISOString(),
        endISO: endDate.toISOString(),
        pointsCount: allPoints.length,
      };

      try {
        const history = JSON.parse(localStorage.getItem("kros_history") || "[]");
        history.push(payload);
        localStorage.setItem("kros_history", JSON.stringify(history.slice(-50)));
      } catch (e) {}

      if (isTelegram && tg.sendData) {
        try {
          tg.sendData(JSON.stringify(payload));
        } catch (e) {
          console.error("sendData error:", e);
          alert("Не вдалося надіслати дані тренеру. Спробуйте ще раз.");
        }
      } else {
        resultEl.textContent += "\n\n⚠️ Відкрийте через Telegram-бота, щоб надіслати тренеру.";
      }

      startBtn.disabled = false;
      stopBtn.disabled = true;
      surnameInput.disabled = false;
      setGpsStatus("📍 GPS: зупинено");
    });

    // ------------------------------------------------------------
    //  Перевірка HTTPS
    // ------------------------------------------------------------
    window.addEventListener("load", () => {
      if (!window.isSecureContext) {
        setGpsStatus("📍 GPS: потрібен HTTPS", "error");
      }
    });
  </script>
</body>
</html>
